# Hardware watchdog for the Pi. Installed to /etc/systemd/system.conf.d/ by
# spanner/deploy.sh; takes effect at the next boot.
#
# systemd (PID 1) feeds the Pi's bcm2835 watchdog every few seconds. If the
# kernel or systemd itself hangs, the feeding stops and the hardware resets the
# board. Without it a hung Pi stays hung until someone power-cycles it.
[Manager]
# The Pi's watchdog tops out at 15s.
RuntimeWatchdogSec=10
# If a shutdown or reboot hangs (the daily one included), force the reset after
# this long instead of the 10 minute default.
RebootWatchdogSec=3min
